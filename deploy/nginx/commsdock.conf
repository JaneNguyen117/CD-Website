server {
    listen 80;
    listen [::]:80;
    server_name commsdock.com www.commsdock.com;

    return 301 https://commsdock.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.commsdock.com;

    ssl_certificate /etc/letsencrypt/live/commsdock.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/commsdock.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://commsdock.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name commsdock.com;

    root /var/www/commsdock;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/commsdock.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/commsdock.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
}
